<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marouene & Feriel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&family=Aref+Ruqaa:wght@700&family=Great+Vibes&family=Scheherazade+New:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --envelope-width: min(500px, 85vw);
  --envelope-height: calc(var(--envelope-width) * 0.6);
  --paper-width: min(320px, 65vw);
  --green: #c0c0c0;
  --dark-green: #a9abb0;
  --gold: #d4af37;
  --slide: 180px;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  display: flex; justify-content: center; align-items: center;
  overflow: hidden;
  background: linear-gradient(135deg, #f5f5f5, #e9eee9);
  font-family: Georgia, "Times New Roman", serif;
}

/* YOUTUBE MUSIC (normal size, hidden off-screen) */
#youtube-player {
  position: fixed; width: 200px; height: 200px;
  left: -9999px; top: 0; pointer-events: none;
}

/* ENVELOPE */
.envelope {
  position: relative; width: var(--envelope-width); height: var(--envelope-height);
  display: flex; justify-content: center; align-items: center; margin-top: 180px;
}
.envelope-back {
  position: absolute; inset: 0; background: var(--green);
  border-radius: 4px; box-shadow: 0 20px 50px rgba(0,0,0,.18); z-index: 1;
}

/* INVITATION */
.invitation {
  position: absolute; z-index: 2; width: var(--paper-width);
  min-height: 430px; padding: 45px 25px;
  background: linear-gradient(135deg, #ffffff, #f8f8f5);
  border: 1px solid #d8d8d8; box-shadow: 0 10px 30px rgba(0,0,0,.15);
  text-align: center;
  transform: translateY(0) rotate(-90deg) scale(.5);
  opacity: 0; visibility: hidden;
  transition: transform 1.8s ease 0s, opacity .3s ease 1.5s, visibility 0s linear 1.8s;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  --burgundy-900: #5a1a2b; --burgundy-800: #6d2236;
  --rosegold-600: #b76e79; --champagne-400: #e3c78f;
}
.invitation::before {
  content: ""; position: absolute; inset: 12px;
  border: 1px solid var(--gold); pointer-events: none;
}

/* ARABIC TEXT */
.bismillah {
  font-family: "Scheherazade New", "Amiri", serif;
  font-size: 17px; font-weight: 700; line-height: 1.6;
  color: var(--burgundy-900); margin: 0;
}
.verse {
  font-family: "Amiri", serif; font-size: 14px; font-style: italic;
  color: var(--rosegold-600); margin: 2px 0 0;
}
.invite-label {
  display: block; font-family: "Amiri", serif; font-size: 12px;
  font-weight: 700; letter-spacing: 3px; color: var(--burgundy-800); margin-bottom: 4px;
}
.ar-names {
  font-family: "Aref Ruqaa", "Amiri", serif;
  font-size: clamp(30px, 8vw, 38px); font-weight: 700; line-height: 1.5; margin: 4px 0;
  background: linear-gradient(135deg, #b8860b, #e6c35c, #b8860b);
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
}
.ar-names .names-logo {
  display: inline-block; width: 38px; height: 38px;
  object-fit: contain; vertical-align: middle; margin: 0 4px;
}

/* DATE */
.date-row {
  width: 100%;
  border-top: 1px solid rgba(227,199,143,.5);
  border-bottom: 1px solid rgba(227,199,143,.5);
  padding: 8px 0; margin-top: 12px;
}
.date-row p {
  font-family: "Amiri", serif; font-size: 15px; font-weight: 700;
  color: var(--burgundy-900); margin: 0;
}

/* COUNTDOWN */
.countdown {
  display: flex; justify-content: center; align-items: center;
  gap: 7px; margin-top: 15px; direction: ltr;
}
.count-box { min-width: 43px; text-align: center; }
.count-number {
  display: block; font-family: "Great Vibes", cursive;
  font-size: 25px; line-height: 1; color: #9b7b22;
}
.count-label {
  display: block; margin-top: 4px; font-family: Georgia, serif;
  font-size: 7px; letter-spacing: 1px; text-transform: uppercase; color: #777;
}
.count-separator { font-size: 20px; color: var(--gold); margin-top: -10px; }

/* FRONT */
.envelope-front {
  position: absolute; z-index: 4; left: 0; bottom: 0; width: 0; height: 0;
  border-left: calc(var(--envelope-width) / 2) solid var(--green);
  border-right: calc(var(--envelope-width) / 2) solid var(--green);
  border-bottom: calc(var(--envelope-height) / 2) solid var(--dark-green);
  border-top: calc(var(--envelope-height) / 2) solid transparent;
  translate: 0 0; transition: translate 1.8s ease 0s; pointer-events: none;
}

/* FLAP */
.envelope-flap {
  position: absolute; top: 0; left: 0; width: 0; height: 0;
  border-left: calc(var(--envelope-width) / 2) solid transparent;
  border-right: calc(var(--envelope-width) / 2) solid transparent;
  border-top: calc(var(--envelope-height) / 2) solid var(--dark-green);
  z-index: 5; transform-origin: top center;
  translate: 0 0; rotate: x 0deg;
  transition: translate 1.8s ease 0s, rotate 1s ease 1.8s, z-index 0s linear 2.3s;
  pointer-events: none;
}

/* SEAL */
.stamp {
  position: absolute; width: 85px; height: 85px; object-fit: contain;
  z-index: 6; cursor: pointer;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,.2));
  translate: 0 0; transition: translate 1.8s ease 0s, scale .2s ease;
  -webkit-tap-highlight-color: transparent;
}
.stamp:hover { scale: 1.08; }

/* OPEN */
.envelope.open .invitation {
  transform: translateY(-120px) rotate(0deg) scale(1.15);
  opacity: 1; visibility: visible;
  transition: transform 1.8s ease 1s, opacity .4s ease 1s, visibility 0s linear 1s;
}
.envelope.open .envelope-front,
.envelope.open .stamp { translate: 0 var(--slide); transition-delay: 1s; }
.envelope.open .stamp { transition: translate 1.8s ease 1s, scale .2s ease; }
.envelope.open .envelope-flap {
  translate: 0 var(--slide); rotate: x 180deg; z-index: 0;
  transition: rotate 1s ease 0s, translate 1.8s ease 1s, z-index 0s linear .5s;
}

/* MOBILE */
@media (max-width: 600px) {
  .envelope { margin-top: 140px; }
  .invitation { min-height: 380px; padding: 35px 20px; }
  .stamp { width: 65px; height: 65px; }
  .countdown { gap: 3px; }
  .count-box { min-width: 39px; }
  .count-number { font-size: 22px; }
}
</style>
</head>
<body>

<div id="youtube-player"></div>

<div class="envelope" id="envelope">

  <!-- INVITATION -->
  <div class="invitation" lang="ar">
    <div>
      <p class="bismillah" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</p>
      <p class="verse" dir="rtl">"وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً"</p>
    </div>

    <div style="margin:14px 0 6px;">
      <span class="invite-label" dir="rtl">دعوة كتب كتاب</span>
      <h2 class="ar-names" dir="rtl">
        مَرْوَانْ
        <img class="names-logo" src="logo.png" alt="&amp;">
        فَرِيَالْ
      </h2>
    </div>

    <div class="date-row">
      <p dir="rtl">الأحد، 11 أكتـوبـر 2026</p>
    </div>

    <div class="countdown" id="countdown">
      <div class="count-box"><span class="count-number" id="days">00</span><span class="count-label">Days</span></div>
      <div class="count-separator">:</div>
      <div class="count-box"><span class="count-number" id="hours">00</span><span class="count-label">Hours</span></div>
      <div class="count-separator">:</div>
      <div class="count-box"><span class="count-number" id="minutes">00</span><span class="count-label">Minutes</span></div>
      <div class="count-separator">:</div>
      <div class="count-box"><span class="count-number" id="seconds">00</span><span class="count-label">Seconds</span></div>
    </div>
  </div>

  <div class="envelope-back"></div>
  <div class="envelope-flap"></div>
  <img class="stamp" id="seal" src="logo.png" alt="Open invitation">
  <div class="envelope-front"></div>

</div>

<script>
/* =====================================================
   YOUTUBE MUSIC
   ===================================================== */
const SONG_ID = "aktY1vejF9Y";

let youtubePlayer = null;
let youtubeReady = false;
let musicRequested = false;

const youtubeScript = document.createElement("script");
youtubeScript.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(youtubeScript);

function onYouTubeIframeAPIReady() {
  const vars = {
    autoplay: 0,
    controls: 0,
    disablekb: 1,
    fs: 0,
    modestbranding: 1,
    rel: 0,
    playsinline: 1,
    loop: 1,
    playlist: SONG_ID   // needed for looping
  };

  // origin only works on http/https (not file://)
  if (location.protocol.startsWith("http")) {
    vars.origin = location.origin;
  }

  youtubePlayer = new YT.Player("youtube-player", {
    height: "200",
    width: "200",
    videoId: SONG_ID,
    playerVars: vars,
    events: {
      onReady: function () {
        youtubeReady = true;
        youtubePlayer.setVolume(80);
        if (musicRequested) {
          youtubePlayer.unMute();
          youtubePlayer.playVideo();
        }
      },
      onError: function (e) {
        console.warn("YouTube error:", e.data);
      }
    }
  });
}

function playMusic() {
  musicRequested = true;
  if (youtubeReady && youtubePlayer) {
    youtubePlayer.unMute();
    youtubePlayer.playVideo();
  }
}

function pauseMusic() {
  musicRequested = false;
  if (youtubeReady && youtubePlayer) {
    youtubePlayer.pauseVideo();
  }
}

/* =====================================================
   COUNTDOWN
   ===================================================== */
const weddingDate = new Date("2026-10-11T00:00:00").getTime();

function updateCountdown() {
  const diff = weddingDate - Date.now();
  const set = (id, v) =>
    (document.getElementById(id).textContent = String(v).padStart(2, "0"));

  if (diff <= 0) {
    set("days", 0); set("hours", 0); set("minutes", 0); set("seconds", 0);
    return;
  }

  set("days", Math.floor(diff / 86400000));
  set("hours", Math.floor((diff % 86400000) / 3600000));
  set("minutes", Math.floor((diff % 3600000) / 60000));
  set("seconds", Math.floor((diff % 60000) / 1000));
}

updateCountdown();
setInterval(updateCountdown, 1000);

/* =====================================================
   ENVELOPE OPEN / CLOSE
   ===================================================== */
const envelope = document.getElementById("envelope");
const seal = document.getElementById("seal");

seal.addEventListener("click", () => {
  const isOpen = envelope.classList.toggle("open");
  if (isOpen) {
    playMusic();
  } else {
    pauseMusic();
  }
});
</script>

</body>
</html>
